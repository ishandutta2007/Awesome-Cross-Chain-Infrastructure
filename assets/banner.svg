<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b" />
      <stop offset="50%" stop-color="#0f0c24" />
      <stop offset="100%" stop-color="#050212" />
    </linearGradient>

    <!-- Neon Glow Blue -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Neon Glow Purple -->
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f355da" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#251b4f" stroke-width="0.5" opacity="0.3"/>
    </pattern>

    <!-- Blur Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Styles for Animations -->
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes orbit {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -80;
        }
      }
      .node-pulse {
        animation: pulse 4s ease-in-out infinite;
        transform-origin: center;
      }
      .node-pulse-delayed {
        animation: pulse 4s ease-in-out infinite;
        animation-delay: 2s;
        transform-origin: center;
      }
      .orbit-group {
        animation: orbit 20s linear infinite;
        transform-origin: 650px 125px;
      }
      .dash-line {
        stroke-dasharray: 8, 8;
        animation: dash 3s linear infinite;
      }
      .text-title {
        font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        fill: url(#neonBlue);
        font-size: 38px;
        letter-spacing: 2px;
      }
      .text-subtitle {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 400;
        fill: #9a92c1;
        font-size: 14px;
        letter-spacing: 4px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="250" fill="url(#bgGrad)" />
  <rect width="800" height="250" fill="url(#grid)" />

  <!-- Abstract Interoperability Graphics -->
  <!-- Connection Paths -->
  <path d="M 500,125 Q 575,50 650,125 T 800,125" fill="none" stroke="url(#neonBlue)" stroke-width="1.5" opacity="0.4" />
  <path d="M 450,180 Q 550,220 650,125 T 750,50" fill="none" stroke="url(#neonPurple)" stroke-width="1.5" opacity="0.3" />
  <line x1="100" y1="180" x2="700" y2="180" stroke="url(#neonBlue)" stroke-width="2" class="dash-line" opacity="0.6" />
  <line x1="50" y1="70" x2="750" y2="70" stroke="url(#neonPurple)" stroke-width="2" class="dash-line" opacity="0.4" />

  <!-- Animated Nodes -->
  <!-- Center Node -->
  <g class="orbit-group">
    <!-- Orbital Lines -->
    <circle cx="650" cy="125" r="60" fill="none" stroke="#2c1e6b" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="650" cy="125" r="40" fill="none" stroke="#37248c" stroke-width="1" />
    
    <!-- Outer orbiting dots -->
    <circle cx="590" cy="125" r="4" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="710" cy="125" r="5" fill="#f355da" filter="url(#glow)" />
    <circle cx="650" cy="65" r="4.5" fill="#7000ff" filter="url(#glow)" />
  </g>

  <!-- Pulsing Nodes -->
  <circle cx="650" cy="125" r="20" fill="#1b1248" stroke="url(#neonBlue)" stroke-width="2" filter="url(#glow)" />
  <circle cx="650" cy="125" r="6" fill="#00f2fe" class="node-pulse" />

  <circle cx="500" cy="70" r="12" fill="#1b1248" stroke="url(#neonPurple)" stroke-width="1.5" class="node-pulse" />
  <circle cx="500" cy="70" r="4" fill="#f355da" />

  <circle cx="580" cy="190" r="16" fill="#1b1248" stroke="url(#neonBlue)" stroke-width="1.5" class="node-pulse-delayed" />
  <circle cx="580" cy="190" r="5" fill="#00f2fe" />

  <circle cx="720" cy="80" r="10" fill="#1b1248" stroke="url(#neonPurple)" stroke-width="1" />
  <circle cx="720" cy="80" r="3" fill="#7000ff" class="node-pulse" />

  <!-- Text & Branding -->
  <g transform="translate(60, 115)">
    <!-- Glow behind Title -->
    <text x="0" y="0" class="text-title" filter="url(#glow)" opacity="0.3" fill="#00f2fe">CROSS-CHAIN</text>
    <text x="0" y="42" class="text-title" filter="url(#glow)" opacity="0.3" fill="#7000ff">INFRASTRUCTURE</text>

    <!-- Main Title Text -->
    <text x="0" y="0" class="text-title">CROSS-CHAIN</text>
    <text x="0" y="42" class="text-title" style="fill: url(#neonPurple)">INFRASTRUCTURE</text>
    
    <!-- Subtitle -->
    <text x="2" y="-25" class="text-subtitle">AWESOME CURATED LIST</text>
  </g>
</svg>
